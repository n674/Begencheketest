<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css?v=5">

  <title>BEGENCHEKE</title>
</head>

<body>
  <div id="app">

    <header>
      <button id="menu" aria-label="Меню">☰</button>
      <h1 id="heading">Все заметки</h1>
      <button id="search" aria-label="Поиск">⌕</button>
    </header>

    <!-- Uzun basma seçim başlığı -->
    <div id="selectionBar">
      <span id="selectionCount">1</span>
      <button id="selectionCancel">Cancel</button>
    </div>

    <main id="content"></main>

    <button id="fab" aria-label="Добавить">✎</button>

    <!-- Samsung Notes tarzı alt menü -->
    <div id="selectionActions">
      <button id="actionMove">
        <span class="actionIcon">▣</span>
        <span>Move</span>
      </button>

      <button id="actionLock">
        <span class="actionIcon">♙</span>
        <span>Lock</span>
      </button>

      <button id="actionShare">
        <span class="actionIcon">↗</span>
        <span>Share</span>
      </button>

      <button id="actionDelete">
        <span class="actionIcon">▤</span>
        <span>Delete</span>
      </button>

      <button id="actionMore">
        <span class="actionIcon">⋮</span>
        <span>More</span>
      </button>
    </div>

    <div id="shade"></div>

    <aside id="drawer">
      <div class="drawerTop">
        <b>BEGENCHEKE</b>
        <span id="closeDrawer">✕</span>
      </div>
      <nav id="nav"></nav>
    </aside>

    <section id="editor">
      <div class="editorBar">
        <button id="back">‹</button>
        <span>Заметка</span>
        <button id="save">✓</button>
      </div>

      <input id="noteTitle" placeholder="Название">
      <textarea id="noteBody" placeholder="Начните писать..."></textarea>

      <div class="editorFooter">
        BEGENCHEKE · Заметки
      </div>
    </section>

    <div id="modalWrap">
      <div id="modal"></div>
    </div>

  </div>

  <script src="./app.js?v=7"></script>
</body>
</html>
